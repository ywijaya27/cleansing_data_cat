<script>
/**
 * Konfigurasi Aplikasi Cleansing Data & Material Intelligence
 * Menggunakan Google Apps Script Web App sebagai Backend REST API
 */
window.APP_CONFIG = {
  // Mode koneksi utama: 'appscript' (Backend Google Apps Script)
  // Opsi lain: 'api' (Node.js/Express) atau 'direct' (Supabase langsung)
  MODE: 'appscript',

  // Masukkan URL Web App Google Apps Script Anda di sini:
  // Contoh: 'https://script.google.com/macros/s/AKfycbx.../exec'
  GAS_URL: 'https://script.google.com/macros/s/AKfycbxb1A_cF7CHNlRKARSdC4B2RN6FV3iFRpJHkJ4QgC9s13J_7ZZo051bhUBeVstO_862/exec',

  // URL Backend Node.js Express (opsional jika menggunakan mode 'api')
  API_BASE_URL: 'http://localhost:5000/api',

  // Konfigurasi Database Supabase PostgreSQL (dikelola oleh backend Apps Script)
  SUPABASE_URL: 'https://tayybadwfypmedjixemd.supabase.co',
  SUPABASE_KEY: '',

  // Versi Aplikasi
  VERSION: '2.2.0-appscript'
};

;
/* Shared by the browser, Node API and generated Apps Script AccessPolicy.gs. */
var AccessPolicy = (() => {
  'use strict';
  const menus = ['dashboard', 'upload', 'materials', 'duplicates', 'similarity', 'consistency', 'reports', 'users', 'settings'];
  const flags = ['can_upload', 'can_run_ai', 'can_review', 'can_merge', 'can_manage_settings', 'can_run_consistency', 'can_export_consistency'];
  function normalize(role, raw = {}) {
    role = String(role || 'GUEST').toUpperCase();
    let allowed = raw.allowed_menus;
    if (typeof allowed === 'string') { try { allowed = JSON.parse(allowed); } catch (_) { allowed = []; } }
    const result = { role, allowed_menus: Array.isArray(allowed) ? allowed.filter(x => menus.includes(x)) : [] };
    flags.forEach(key => { result[key] = raw[key] === true; });
    if (role === 'ADMIN') {
      result.allowed_menus = menus.slice();
      flags.forEach(key => { result[key] = true; });
    } else {
      result.allowed_menus = result.allowed_menus.filter(x => x !== 'users');
      if (role === 'GUEST') {
        result.allowed_menus = result.allowed_menus.filter(x => !['upload', 'duplicates'].includes(x));
        flags.forEach(key => { result[key] = false; });
      }
    }
    return result;
  }
  const rules = {
    getDashboardData: ['dashboard'], getDashboardSummary: ['dashboard'],
    getMaterials: ['materials'], getMaterialMaster: ['materials'],
    getConsistencyMaterials: ['consistency', 'can_run_consistency'],
    authorizeConsistencyExport: ['consistency', 'can_export_consistency'],
    uploadMaterials: ['upload', 'can_upload'], uploadMasterData: ['upload', 'can_upload'],
    getUploadHistory: ['upload'], normalizeMaterial: ['materials', 'can_upload'],
    runAICleansingAnalysis: ['duplicates', 'can_run_ai'], runAiCleansingAnalysis: ['duplicates', 'can_run_ai'],
    getDuplicateCandidates: ['duplicates'], getDuplicates: ['duplicates'],
    getSimilarMaterials: ['similarity'], getApprovedDuplicatesReport: ['reports'],
    setupSupabaseConfig: ['settings', 'can_manage_settings'], testSupabaseConnection: ['settings', 'can_manage_settings'],
    getUserManagementData: ['users'], saveRolePermissions: ['users'], saveAppUser: ['users'], deleteAppUser: ['users']
  };
  function allows(role, raw, action, args = []) {
    if (['loginUser', 'getAppStatus', 'getSystemAccessControl', 'getSession', 'logoutUser'].includes(action)) return true;
    const permission = normalize(role, raw);
    const rule = action === 'saveDuplicateDecision'
      ? ['duplicates', args[1] === 'MERGE_AND_OBSOLETE' ? 'can_merge' : 'can_review'] : rules[action];
    return Boolean(rule && permission.allowed_menus.includes(rule[0]) && (!rule[1] || permission[rule[1]]));
  }
  return { menus, flags, normalize, allows };
})();
if (typeof module !== 'undefined') module.exports = AccessPolicy;

;
/**
 * Client API Adapter
 * Menghubungkan antarmuka frontend ke:
 * 1. Google Apps Script Web App (Mode 'appscript' / GAS REST API via fetch)
 * 2. Lingkungan Internal Apps Script (via native google.script.run)
 * 3. Database Supabase PostgreSQL secara langsung (Direct Mode - untuk hosting statis tanpa backend)
 * 4. Backend REST API Node.js / Express (Mode 'api' di localhost)
 */
(() => {
  'use strict';

  const config = window.APP_CONFIG || {
    MODE: 'appscript',
    GAS_URL: '',
    API_BASE_URL: 'http://localhost:5000/api',
    SUPABASE_URL: 'https://tayybadwfypmedjixemd.supabase.co',
    SUPABASE_KEY: ''
  };

  /**
   * Helper Pengambilan Kredensial & URL
   * Memprioritaskan nilai yang sudah dikonfigurasi di js/config.js agar tidak tertimpa cache localStorage lama.
   */
  const getGasUrl = () => {
    return (config.GAS_URL || localStorage.getItem('gas_url') || '').trim();
  };

  const getSupabaseUrl = () => {
    return (config.SUPABASE_URL || localStorage.getItem('supabase_url') || 'https://tayybadwfypmedjixemd.supabase.co').replace(/\/$/, '');
  };

  const getSupabaseKey = () => {
    return (config.SUPABASE_KEY || localStorage.getItem('supabase_key') || '').trim();
  };

  /**
   * Helper Request ke Google Apps Script Web App (POST dengan text/plain anti-CORS preflight)
   */
  async function callGasWebApi(action, args = []) {
    const gasUrl = getGasUrl();
    if (!gasUrl) {
      throw new Error('Google Apps Script Web App URL belum diisi. Masukkan URL Web App di menu Pengaturan atau di js/config.js.');
    }

    const token = JSON.parse(sessionStorage.getItem('admin_session') || 'null')?.token || '';
    const payload = JSON.stringify({ action, args, token });
    const res = await fetch(gasUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8' // WAJIB text/plain agar tidak memicu CORS OPTIONS preflight ditolak GAS
      },
      body: payload
    });

    const rawText = await res.text().catch(() => '');
    if (!res.ok) {
      throw new Error(rawText || `GAS Web App HTTP ${res.status}: ${res.statusText}`);
    }

    let data = {};
    try {
      data = rawText ? JSON.parse(rawText) : {};
    } catch (_) {
      if (/<!doctype|<html|<title>/i.test(rawText)) {
        throw new Error('Google Apps Script mengembalikan halaman HTML, bukan JSON. Pastikan Web App sudah di-deploy dengan akses "Anyone (Siapa saja)" dan URL /exec benar.');
      }
      throw new Error('Respons Google Apps Script tidak valid (bukan JSON).');
    }

    if (!data.success) {
      throw new Error(data.message || 'Eksekusi Google Apps Script gagal.');
    }
    return data;
  }

  /**
   * Helper SHA-256 Hash di Browser via Web Crypto API
   */
  async function sha256Hex(str) {
    const buf = new TextEncoder().encode(str);
    const hash = await window.crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash))
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');
  }

  /**
   * Helper Request langsung ke Supabase REST API (PostgREST)
   */
  async function supabaseRequest(endpoint, options = {}) {
    const url = getSupabaseUrl();
    const key = getSupabaseKey();

    if (!key) {
      throw new Error('Supabase Key belum dimasukkan. Buka menu Pengaturan untuk memasukkan Service Role Key Supabase Anda.');
    }

    const fullUrl = `${url}/rest/v1/${endpoint.replace(/^\//, '')}`;
    const headers = {
      'apikey': key,
      'Authorization': `Bearer ${key}`,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=representation',
      ...(options.headers || {})
    };

    const res = await fetch(fullUrl, {
      method: options.method || 'GET',
      headers,
      body: options.body ? JSON.stringify(options.body) : undefined
    });

    if (!res.ok) {
      const errText = await res.text();
      let errJson;
      try { errJson = JSON.parse(errText); } catch (_) { errJson = { message: errText }; }
      throw new Error(errJson.message || `Supabase HTTP ${res.status}: ${res.statusText}`);
    }

    const text = await res.text();
    try {
      return text ? JSON.parse(text) : null;
    } catch (_) {
      return text;
    }
  }

  /**
   * Helper fetch HTTP request ke Backend Node.js / Express
   */
  async function backendHttp(endpoint, options = {}) {
    const baseUrl = (config.API_BASE_URL || '').replace(/\/$/, '');
    const url = endpoint.startsWith('http') ? endpoint : `${baseUrl}${endpoint}`;

    const headers = {
      'Content-Type': 'application/json',
      'Accept': 'application/json',
      ...(options.headers || {})
    };

    try {
      const savedSession = sessionStorage.getItem('admin_session');
      if (savedSession) {
        const u = JSON.parse(savedSession);
        if (u && u.token) headers['Authorization'] = `Bearer ${u.token}`;
      }
    } catch (_) {}

    const res = await fetch(url, {
      ...options,
      headers
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.message || `HTTP ${res.status}: ${res.statusText}`);
    }
    return data;
  }

  /**
   * Handler Direct Supabase untuk seluruh aksi sistem (Fallback)
   */
  async function executeDirectSupabase(name, ...args) {
    const sUrl = getSupabaseUrl();
    const sKey = getSupabaseKey();

    switch (name) {
      case 'getAppStatus': {
        if (!sKey) {
          return {
            success: true,
            data: {
              configured: false,
              connectionOk: false,
              url: sUrl,
              connMessage: 'Supabase Key belum dimasukkan. Buka menu Pengaturan.'
            }
          };
        }
        try {
          await supabaseRequest('material_raw?select=id&limit=1');
          return {
            success: true,
            data: {
              configured: true,
              connectionOk: true,
              url: sUrl,
              connMessage: 'Terhubung ke database Supabase PostgreSQL.'
            }
          };
        } catch (err) {
          return {
            success: true,
            data: {
              configured: false,
              connectionOk: false,
              url: sUrl,
              connMessage: 'Koneksi gagal: ' + err.message
            }
          };
        }
      }

      case 'setupSupabaseConfig': {
        const [url, key] = args;
        if (!url) throw new Error('Project URL Supabase wajib diisi.');
        if (!key) throw new Error('Service Role Key wajib diisi.');

        const cleanUrl = url.trim().replace(/\/$/, '');
        const cleanKey = key.trim();

        const testRes = await fetch(`${cleanUrl}/rest/v1/material_raw?select=id&limit=1`, {
          headers: {
            'apikey': cleanKey,
            'Authorization': `Bearer ${cleanKey}`
          }
        });

        if (!testRes.ok) {
          const errText = await testRes.text();
          throw new Error('Gagal terhubung ke Supabase: ' + (errText || testRes.statusText));
        }

        localStorage.setItem('supabase_url', cleanUrl);
        localStorage.setItem('supabase_key', cleanKey);

        return {
          success: true,
          data: { url: cleanUrl },
          message: 'Koneksi ke Supabase BERHASIL dan disimpan di browser!'
        };
      }

      case 'testSupabaseConnection': {
        await supabaseRequest('material_raw?select=id&limit=1');
        return { success: true, message: 'Koneksi ke Supabase PostgreSQL BERHASIL!' };
      }

      case 'loginUser': {
        const [username, password] = args;
        if (!username || !password) throw new Error('Username dan password wajib diisi.');
        const uName = username.trim().toLowerCase();
        const pHash = await sha256Hex(password);

        const users = await supabaseRequest(`app_users?username=eq.${encodeURIComponent(uName)}&is_active=eq.true&limit=1`);
        if (!users || !users.length) throw new Error('Username atau password salah.');
        const user = users[0];
        if (user.password_hash !== pHash) throw new Error('Username atau password salah.');

        let permissions = null;
        try {
          const perms = await supabaseRequest(`app_role_permissions?role=eq.${encodeURIComponent(user.role)}&limit=1`);
          if (perms && perms[0]) {
            permissions = perms[0];
            if (typeof permissions.allowed_menus === 'string') {
              try { permissions.allowed_menus = JSON.parse(permissions.allowed_menus); } catch (_) {}
            }
          }
        } catch (_) {}

        return {
          success: true,
          data: {
            id: user.id,
            username: user.username,
            fullName: user.full_name || user.username,
            full_name: user.full_name || user.username,
            role: user.role,
            permissions: permissions || {},
            token: 'direct_' + user.id + '_' + Date.now()
          },
          message: 'Login berhasil.'
        };
      }

      case 'getSystemAccessControl': {
        let allRoles = [];
        try {
          allRoles = await supabaseRequest('app_role_permissions?select=*') || [];
          allRoles.forEach(r => {
            if (typeof r.allowed_menus === 'string') {
              try { r.allowed_menus = JSON.parse(r.allowed_menus); } catch (_) {}
            }
          });
        } catch (_) {}

        return {
          success: true,
          data: {
            allRoles,
            guestPermissions: allRoles.find(r => r.role === 'GUEST') || {
              role: 'GUEST',
              allowed_menus: ['dashboard', 'materials', 'similarity', 'reports'],
              can_upload: false,
              can_run_ai: false,
              can_merge: false,
              can_manage_settings: false
            }
          }
        };
      }

      case 'getDashboardData':
      case 'getDashboardSummary': {
        const [allMat, allDup, allSim] = await Promise.all([
          supabaseRequest('material_raw?select=id,material_description,manufacturer,part_number,base_uom,stock_qty,stock_value,material_group'),
          supabaseRequest('duplicate_analysis?select=potential_saving,review_status'),
          supabaseRequest('similar_material?select=id')
        ]);

        const totalMat = allMat?.length || 0;
        const dupCount = allDup?.length || 0;
        const simCount = allSim?.length || 0;
        const pendingReview = allDup?.filter(x => x.review_status === 'PENDING').length || 0;
        const totalSavings = (allDup || []).reduce((acc, x) => acc + (Number(x.potential_saving) || 0), 0);

        const groupMap = {};
        let noMfr = 0, noPn = 0, noUom = 0;
        (allMat || []).forEach(m => {
          const g = m.material_group || 'Uncategorized';
          groupMap[g] = (groupMap[g] || 0) + 1;
          if (!m.manufacturer) noMfr++;
          if (!m.part_number) noPn++;
          if (!m.base_uom) noUom++;
        });
        const commodity = Object.keys(groupMap)
          .map(k => ({ group: k, count: groupMap[k] }))
          .sort((a, b) => b.count - a.count)
          .slice(0, 8);
        const totalCells = Math.max(1, totalMat * 4);
        const missingCells = noMfr + noPn + noUom;
        const qualityScore = totalMat ? Math.round(((totalCells - missingCells) / totalCells) * 1000) / 10 : 100;

        return {
          success: true,
          data: {
            totalMaterial: totalMat,
            duplicateCandidate: dupCount,
            similarCandidate: simCount,
            pendingReview: pendingReview,
            potentialSaving: totalSavings,
            dataQualityScore: qualityScore,
            qualityIssues: { noMfr, noPn, noUom },
            commodity,
            insight: `Ditemukan ${dupCount} kandidat duplikat dan ${simCount} material serupa. Lakukan review pada menu Duplicate Review.`,
            // Alias kompatibilitas
            total_materials: totalMat,
            duplicated_count: dupCount,
            similar_count: simCount,
            potential_savings: totalSavings,
            data_quality_score: qualityScore,
            pending_review_count: pendingReview,
            group_distribution: commodity
          }
        };
      }

      case 'getMaterials':
      case 'getMaterialMaster': {
        const [page = 1, pageSize = 25, search = ''] = args;
        const p = Math.max(1, Number(page) || 1);
        const ps = Math.min(100, Math.max(10, Number(pageSize) || 25));
        const offset = (p - 1) * ps;
        let q = `material_raw?select=*&order=id.desc&limit=${ps}&offset=${offset}`;
        if (search) {
          const sc = encodeURIComponent(`%${String(search).trim()}%`);
          q += `&or=(material_code.ilike.${sc},material_description.ilike.${sc},manufacturer.ilike.${sc},part_number.ilike.${sc})`;
        }
        const rows = await supabaseRequest(q) || [];
        return {
          success: true,
          data: name === 'getMaterialMaster' ? rows : { rows, page: p, pageSize: ps }
        };
      }

      case 'uploadMaterials':
      case 'uploadMasterData': {
        const [rows = [], fileName = ''] = args;
        if (!rows.length) throw new Error('Data upload kosong.');

        // 1. Ambil seluruh material_code yang sudah ada di Supabase untuk deduplikasi
        const existingCodesSet = new Set();
        try {
          const existingList = await supabaseRequest('material_raw?select=material_code&limit=50000');
          if (Array.isArray(existingList)) {
            existingList.forEach(item => {
              if (item.material_code) existingCodesSet.add(String(item.material_code).trim().toUpperCase());
            });
          }
        } catch (_) {}

        let skippedDuplicates = 0;
        const validToInsert = [];
        const seenInFile = new Set();

        rows.forEach((r, i) => {
          const code = String(r.material_code || r.MATERIAL_CODE || r.Material_Code || '').trim();
          const desc = String(r.material_description || r.MATERIAL_DESCRIPTION || r.Deskripsi || r.item_text_result || '').trim();
          const mfr = String(r.manufacturer || r.MANUFACTURER || '').trim();
          const pn = String(r.part_number || r.PART_NUMBER || '').trim();
          const grp = String(r.material_group || r.MATERIAL_GROUP || 'GENERAL').trim().toUpperCase();
          const uom = String(r.base_uom || r.BASE_UOM || 'EA').trim().toUpperCase();
          const qty = parseFloat(r.stock_qty || r.STOCK_QTY || 0) || 0;
          const val = parseFloat(r.stock_value || r.STOCK_VALUE || 0) || 0;

          const finalCode = code || (pn ? `PN-${pn.replace(/[^a-zA-Z0-9]/g, '')}` : `MAT-${100000 + i + 1}`);
          const upperCode = finalCode.toUpperCase();

          // Jika kode material sudah ada di database atau duplikat dalam file, lewati (skip)
          if (existingCodesSet.has(upperCode) || seenInFile.has(upperCode)) {
            skippedDuplicates++;
            return;
          }

          seenInFile.add(upperCode);
          validToInsert.push({
            material_code: finalCode,
            material_description: desc,
            manufacturer: mfr,
            part_number: pn,
            material_group: grp,
            base_uom: uom,
            stock_qty: qty,
            stock_value: val
          });
        });

        // 2. Simpan Riwayat Batch Upload
        let batchId = null;
        try {
          const bRes = await supabaseRequest('upload_batch', {
            method: 'POST',
            body: [{
              file_name: fileName || 'Upload_Master_' + new Date().toISOString().slice(0, 10),
              total_records: rows.length,
              uploaded_by: 'Direct User',
              status: 'COMPLETED'
            }]
          });
          if (Array.isArray(bRes) && bRes[0]) batchId = bRes[0].id;
        } catch (_) {}

        // 3. Masukkan hanya data baru (chunk 500)
        const CHUNK = 500;
        for (let i = 0; i < validToInsert.length; i += CHUNK) {
          const chunk = validToInsert.slice(i, i + CHUNK);
          if (batchId) {
            chunk.forEach(c => c.batch_id = batchId);
          }
          await supabaseRequest('material_raw', {
            method: 'POST',
            prefer: 'return=minimal',
            body: chunk
          });
        }

        return {
          success: true,
          data: {
            inserted: validToInsert.length,
            skipped: skippedDuplicates,
            errors: 0,
            totalRows: rows.length
          },
          message: `Upload selesai: ${validToInsert.length} data baru ditambahkan, ${skippedDuplicates} data duplikat dilewati.`
        };
      }

      case 'normalizeMaterial': {
        const [materialId] = args;
        const rows = await supabaseRequest(`material_raw?id=eq.${encodeURIComponent(materialId)}&select=*`);
        if (!rows || !rows.length) throw new Error('Material tidak ditemukan.');
        const m = rows[0];
        const normDesc = String(m.material_description || '').trim().toUpperCase().replace(/\s+/g, ' ');
        const res = await supabaseRequest('material_normalized', {
          method: 'POST',
          body: [{
            raw_material_id: m.id,
            normalized_description: normDesc,
            normalized_brand: String(m.manufacturer || '').trim().toUpperCase(),
            normalized_part_number: String(m.part_number || '').trim().toUpperCase(),
            normalization_status: 'COMPLETED'
          }]
        });
        return { success: true, data: res ? res[0] : { normalized_description: normDesc }, message: 'Material berhasil dinormalisasi.' };
      }

      case 'getUploadHistory': {
        const [limit = 20] = args;
        const limitNum = Math.min(100, Number(limit) || 20);
        const rows = await supabaseRequest(`upload_batch?select=*&order=created_at.desc&limit=${limitNum}`).catch(() => []);
        return { success: true, data: rows || [] };
      }

      case 'runAICleansingAnalysis':
      case 'runAiCleansingAnalysis': {
        const [minDup = 75, minSim = 60] = args;
        const res = await supabaseRequest('rpc/run_material_cleansing_ai', {
          method: 'POST',
          body: { p_min_duplicate_score: Number(minDup) || 75, p_min_similarity_score: Number(minSim) || 60 }
        });
        return { success: true, data: res, message: (res && res.message) || 'Analisis AI selesai diproses.' };
      }

      case 'getDuplicateCandidates':
      case 'getDuplicates': {
        const limit = typeof args[0] === 'number' ? Math.min(300, Math.max(10, args[0])) : 300;
        const rows = await supabaseRequest(`duplicate_analysis?select=*&order=duplicate_score.desc&limit=${limit}`);
        return { success: true, data: rows || [] };
      }

      case 'saveDuplicateDecision': {
        const [candidateId, decision, selectedMaster, notes, reviewerName] = args;
        if (!candidateId) throw new Error('Candidate ID wajib diisi.');

        const reviewer = reviewerName || 'admin';
        const reviewedAt = new Date().toISOString();
        const encodedId = encodeURIComponent(candidateId);

        try {
          await supabaseRequest(`duplicate_analysis?candidate_id=eq.${encodedId}`, {
            method: 'PATCH',
            body: {
              review_status: decision,
              recommended_master_code: selectedMaster || null,
              assigned_reviewer: reviewer,
              review_notes: notes || null,
              reviewed_at: reviewedAt
            }
          });
        } catch (patchErr) {
          if (!/PGRST204|Could not find|does not exist/i.test(String(patchErr.message || patchErr))) {
            throw patchErr;
          }
          let existingFactors = {};
          try {
            const cur = await supabaseRequest(`duplicate_analysis?candidate_id=eq.${encodedId}&select=match_factors&limit=1`);
            if (cur && cur[0] && cur[0].match_factors && typeof cur[0].match_factors === 'object') {
              existingFactors = cur[0].match_factors;
            }
          } catch (_) {}

          await supabaseRequest(`duplicate_analysis?candidate_id=eq.${encodedId}`, {
            method: 'PATCH',
            body: {
              review_status: decision,
              recommended_master_code: selectedMaster || null,
              match_factors: {
                ...existingFactors,
                assigned_reviewer: reviewer,
                review_notes: notes || null,
                reviewed_at: reviewedAt
              }
            }
          });
        }

        if (decision === 'MERGE_AND_OBSOLETE' && selectedMaster) {
          try {
            await supabaseRequest(`material_raw?material_code=eq.${encodeURIComponent(selectedMaster)}`, {
              method: 'PATCH',
              body: { status: 'ACTIVE_GOLDEN' }
            });
          } catch (_) {}
        }
        return { success: true, message: 'Keputusan review berhasil disimpan.' };
      }

      case 'getSimilarMaterials': {
        const [limit = 200] = args;
        const rows = await supabaseRequest(`similar_material?order=similarity_score.desc&limit=${limit}`);
        return { success: true, data: rows || [] };
      }

      case 'getUserManagementData': {
        const [users, roles] = await Promise.all([
          supabaseRequest('app_users?select=id,username,full_name,role,is_active,created_at&order=created_at.asc'),
          supabaseRequest('app_role_permissions?select=*')
        ]);
        (roles || []).forEach(r => {
          if (typeof r.allowed_menus === 'string') {
            try { r.allowed_menus = JSON.parse(r.allowed_menus); } catch (_) {}
          }
        });
        return { success: true, data: { users: users || [], roles: roles || [] } };
      }

      case 'saveRolePermissions': {
        const [roleKey, allowedMenus, permissionsObj] = args;
        if (!roleKey) throw new Error('Role key wajib diisi.');
        const payload = {
          role: roleKey,
          allowed_menus: Array.isArray(allowedMenus) ? allowedMenus : [],
          can_upload: Boolean(permissionsObj?.can_upload),
          can_run_ai: Boolean(permissionsObj?.can_run_ai),
          can_merge: Boolean(permissionsObj?.can_merge),
          can_manage_settings: Boolean(permissionsObj?.can_manage_settings),
          updated_at: new Date().toISOString()
        };
        await supabaseRequest(`app_role_permissions?role=eq.${encodeURIComponent(roleKey)}`, { method: 'PATCH', body: payload });
        return { success: true, message: `Hak akses peran ${roleKey} berhasil disimpan.` };
      }

      case 'saveAppUser': {
        const [userData] = args;
        if (!userData || !userData.username) throw new Error('Username wajib diisi.');
        const uName = userData.username.trim().toLowerCase();
        const fullName = (userData.full_name || uName).trim();
        const role = userData.role || 'OPERATOR';
        const isActive = userData.is_active !== undefined ? Boolean(userData.is_active) : true;

        if (userData.id) {
          const patchData = { full_name: fullName, role: role, is_active: isActive };
          if (userData.password) patchData.password_hash = await sha256Hex(userData.password);
          await supabaseRequest(`app_users?id=eq.${userData.id}`, { method: 'PATCH', body: patchData });
          return { success: true, message: `Pengguna ${uName} berhasil diperbarui.` };
        } else {
          if (!userData.password) throw new Error('Password wajib diisi untuk pengguna baru.');
          const pHash = await sha256Hex(userData.password);
          const newPayload = [{ username: uName, full_name: fullName, password_hash: pHash, role: role, is_active: isActive }];
          const res = await supabaseRequest('app_users', { method: 'POST', body: newPayload });
          return { success: true, data: res ? res[0] : null, message: `Pengguna ${uName} berhasil ditambahkan.` };
        }
      }

      case 'deleteAppUser': {
        const [userId, username] = args;
        if (String(username).toLowerCase() === 'admin') throw new Error('Akun Administrator utama tidak boleh dihapus.');
        await supabaseRequest(`app_users?id=eq.${userId}`, { method: 'DELETE' });
        return { success: true, message: 'Pengguna berhasil dihapus.' };
      }

      case 'getApprovedDuplicatesReport': {
        const [status = 'APPROVED_DUPLICATE'] = args;
        let q = 'duplicate_analysis?order=potential_saving.desc,duplicate_score.desc&limit=500';
        if (status === 'ALL_APPROVED') q += '&review_status=in.(APPROVED_DUPLICATE,MERGE_AND_OBSOLETE)';
        else if (status) q += `&review_status=eq.${encodeURIComponent(status)}`;

        const rows = await supabaseRequest(q) || [];
        let totalSavings = 0;
        let totalStockVal = 0;
        let scoreSum = 0;
        const clusters = new Set();

        rows.forEach(r => {
          const mf = (r.match_factors && typeof r.match_factors === 'object') ? r.match_factors : {};
          if (!r.assigned_reviewer && mf.assigned_reviewer) r.assigned_reviewer = mf.assigned_reviewer;
          if (!r.review_notes && mf.review_notes) r.review_notes = mf.review_notes;
          if (!r.reviewed_at && mf.reviewed_at) r.reviewed_at = mf.reviewed_at;

          totalSavings += Number(r.potential_saving) || 0;
          totalStockVal += (Number(r.val_a) || 0) + (Number(r.val_b) || 0);
          scoreSum += Number(r.duplicate_score) || 0;
          if (r.cluster_id) clusters.add(r.cluster_id);
        });

        return {
          success: true,
          data: {
            summary: {
              totalApproved: rows.length,
              totalPotentialSavings: totalSavings,
              totalStockValue: totalStockVal,
              avgDuplicateScore: rows.length ? parseFloat((scoreSum / rows.length).toFixed(1)) : 0,
              clustersCount: clusters.size
            },
            items: rows
          }
        };
      }

      default:
        throw new Error(`Aksi "${name}" belum didukung di Direct Supabase mode.`);
    }
  }

  /**
   * Fungsi sentral callServer untuk kompatibilitas penuh dengan seluruh kode antarmuka
   */
  window.callServer = async function(name, ...args) {
    // 1. Lingkungan Asli Google Apps Script (didalam Web App iframe)
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(r => {
            if (r && r.success) resolve(r);
            else reject(new Error(r?.message || 'Proses gagal.'));
          })
          .withFailureHandler(e => {
            reject(new Error(e?.message || String(e)));
          }).apiRequest(name, args, JSON.parse(sessionStorage.getItem('admin_session') || 'null')?.token || '');
      });
    }

    // 2. Mode 'appscript' (Memanggil Google Apps Script Web App URL dari GitHub Pages)
    const mode = (config.MODE || 'appscript').toLowerCase();
    const gasUrl = getGasUrl();

    if (mode === 'appscript' || mode === 'gas') {
      if (gasUrl) {
        return await callGasWebApi(name, args);
      } else {
        // A backend is required for server-side authorization.
        throw new Error('Mode direct dinonaktifkan. Gunakan backend Apps Script atau API untuk validasi hak akses.');
      }
    }

    // 3. Mode 'direct' (Langsung ke Supabase)
    if (mode === 'direct') {
      throw new Error('Mode direct dinonaktifkan. Gunakan backend Apps Script atau API untuk validasi hak akses.');
    }

    // 4. Mode 'api' (Backend Node.js Express)
    try {
      switch (name) {
        case 'getSession': return await backendHttp('/auth/session');
        case 'logoutUser': return await backendHttp('/auth/logout', { method: 'POST' });
        case 'authorizeConsistencyExport': return await backendHttp('/consistency/export-authorization', { method: 'POST' });
        case 'getConsistencyMaterials': return await backendHttp(`/consistency/materials?page=${Number(args[0]) || 1}&limit=${Number(args[1]) || 100}`);
        case 'getAppStatus': return await backendHttp('/status');
        case 'getDashboardData':
        case 'getDashboardSummary': return await backendHttp('/materials/dashboard-summary');
        case 'getMaterials':
        case 'getMaterialMaster': {
          const [page = 1, pageSize = 25, search = ''] = args;
          return await backendHttp(`/materials?page=${page}&limit=${pageSize}&search=${encodeURIComponent(search)}`);
        }
        case 'uploadMaterials':
        case 'uploadMasterData': {
          const [rows = [], fileName = ''] = args;
          return await backendHttp('/upload', { method: 'POST', body: JSON.stringify({ rows, fileName }) });
        }
        case 'normalizeMaterial': return await backendHttp(`/materials/${encodeURIComponent(args[0])}/normalize`, { method: 'POST', body: JSON.stringify({}) });
        case 'getUploadHistory': return await backendHttp('/upload/history');
        case 'runAICleansingAnalysis':
        case 'runAiCleansingAnalysis': return await backendHttp('/duplicates/run-ai', { method: 'POST', body: JSON.stringify({}) });
        case 'getDuplicateCandidates':
        case 'getDuplicates': {
          const limit = typeof args[0] === 'number' ? args[0] : 300;
          return await backendHttp(`/duplicates?limit=${limit}`);
        }
        case 'saveDuplicateDecision': {
          const [candidateId, decision, selectedMaster, notes, reviewerName] = args;
          return await backendHttp('/duplicates/decision', {
            method: 'POST',
            body: JSON.stringify({ candidateId, decision, selectedMaster, notes, reviewerName })
          });
        }
        case 'getSimilarMaterials': {
          const [limit = 200] = args;
          return await backendHttp(`/similarity?limit=${limit}`);
        }
        case 'loginUser': {
          const [username, password] = args;
          return await backendHttp('/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
        }
        case 'getSystemAccessControl': return await backendHttp('/auth/access-control');
        case 'getUserManagementData': return await backendHttp('/users');
        case 'saveRolePermissions': {
          const [roleKey, allowedMenus, permissionsObj] = args;
          return await backendHttp('/users/permissions', { method: 'POST', body: JSON.stringify({ roleKey, allowedMenus, permissionsObj }) });
        }
        case 'saveAppUser': {
          const [userData] = args;
          return await backendHttp('/users', { method: 'POST', body: JSON.stringify({ userData }) });
        }
        case 'deleteAppUser': {
          const [userId, username] = args;
          return await backendHttp(`/users/${userId}?username=${encodeURIComponent(username || '')}`, { method: 'DELETE' });
        }
        case 'setupSupabaseConfig': {
          const [url, key] = args;
          return await backendHttp('/settings/supabase', { method: 'POST', body: JSON.stringify({ url, key }) });
        }
        case 'testSupabaseConnection': return await backendHttp('/settings/test-connection');
        case 'getApprovedDuplicatesReport': {
          const [status = 'APPROVED_DUPLICATE'] = args;
          return await backendHttp(`/reports/approved-duplicates?status=${encodeURIComponent(status)}`);
        }
        default:
          throw new Error(`Endpoint untuk aksi "${name}" tidak ditemukan.`);
      }
    } catch (err) {
      throw err;
    }
  };
})();

 *    - MODIFIER(S) (Kata Pembatas / Tipe)
 *    - Characteristics and Values (Karakteristik & Nilai Spesifikasi Teknis)
 *    - Dimensions + Material + Class and/or Grade and/or Schedule
 *    - Equipment Name + Equipment Reference Information (Model No., Drawing No., Position No., Mfr, P/N)
 * 2. Konsistensi Penulisan Tanda Baca & Delimiter (Koma spasi ', ', KEY=VALUE, dsb.)
 * 3. Kepatuhan Kamus Singkatan Baku (Abbreviation Table)
 * 4. Pengecekan Typo & Karakter Anomali
 * 5. Generator Rekomendasi "Text Saran" Terstandarisasi untuk Side-by-Side Review
 * =============================================================================
 */

(() => {
  'use strict';

  // Inisialisasi lookup map untuk pencarian O(1)
  let abvMap = null;
  let fullToAbvMap = null;

  function initMaps() {
    if (abvMap && fullToAbvMap) return;
    abvMap = new Map();
    fullToAbvMap = new Map();

    const rules = window.CATALOG_RULES || { ABBREVIATIONS: [], TEMPLATES: [] };
    (rules.ABBREVIATIONS || []).forEach(item => {
      const a = (item.abv || '').trim().toUpperCase();
      const f = (item.full || '').trim().toUpperCase();
      if (a) abvMap.set(a, f);
      if (f && f.length > 2) fullToAbvMap.set(f, a);
    });

    // Tambahan singkatan esensial domain cataloguing jika belum ada di kamus
    const coreAbvs = {
      'STAINLESS STEEL': 'SS',
      'CARBON STEEL': 'CS',
      'CAST IRON': 'CI',
      'DUCTILE IRON': 'DI',
      'DIAMETER': 'DIA',
      'THICKNESS': 'THK',
      'LENGTH': 'LG',
      'HEIGHT': 'HT',
      'WIDTH': 'WD',
      'PRESSURE': 'PRESS',
      'TEMPERATURE': 'TEMP',
      'STANDARD': 'STD',
      'SPECIFICATION': 'SPEC',
      'MANUFACTURER': 'MFR',
      'MANUFACTURE': 'MFR',
      'PART NUMBER': 'P/N',
      'PART NO': 'P/N',
      'MODEL NUMBER': 'MDL',
      'MODEL NO': 'MDL',
      'DRAWING NUMBER': 'DWG',
      'DRAWING NO': 'DWG',
      'POSITION NUMBER': 'POS',
      'POSITION NO': 'POS',
      'SCHEDULE': 'SCH',
      'CLASS': 'CL',
      'GRADE': 'GR',
      'POUND': 'LB',
      'POUNDS': 'LB',
      'INCH': 'IN',
      'INCHES': 'IN',
      'FEET': 'FT',
      'FOOT': 'FT',
      'GALVANIZED': 'GALV',
      'COUPLING': 'CPLG',
      'FLANGED': 'FLG',
      'THREADED': 'THD'
    };
    Object.entries(coreAbvs).forEach(([full, abv]) => {
      if (!fullToAbvMap.has(full)) fullToAbvMap.set(full, abv);
      if (!abvMap.has(abv)) abvMap.set(abv, full);
    });
  }

  function clean(val) {
    if (val === null || val === undefined) return '';
    return String(val).trim();
  }

  function isBlankOrInvalid(val) {
    const s = clean(val).toUpperCase();
    return !s || s === 'NONE' || s === '???' || s === '??' || s === '-' || s === 'NULL' || s === 'N/A';
  }

  /**
   * Mengonversi kata atau frasa menjadi singkatan baku
   */
  function applyStandardAbbreviations(text) {
    if (!text) return '';
    initMaps();

    let res = String(text).toUpperCase();

    // 1. Ganti unit & tanda kutip fisik:
    // e.g. 2" -> 2 IN, 1/2" -> 1/2 IN
    res = res.replace(/(\d+(?:\.\d+)?|\d+\/\d+)\s*"/g, '$1 IN');
    res = res.replace(/(\d+(?:\.\d+)?|\d+\/\d+)\s*'/g, '$1 FT');

    // 2. Ganti frasa panjang lebih dulu (misal STAINLESS STEEL -> SS)
    const sortedFullKeys = Array.from(fullToAbvMap.keys()).sort((a, b) => b.length - a.length);
    sortedFullKeys.forEach(full => {
      if (full.length >= 4) {
        const regex = new RegExp(`\\b${full.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&')}\\b`, 'g');
        const abv = fullToAbvMap.get(full);
        if (abv && abv !== full) {
          res = res.replace(regex, abv);
        }
      }
    });

    return res;
  }

  /**
   * Membersihkan tanda baca dan menstandarisasi delimiter
   */
  function cleanPunctuationAndDelimiters(text) {
    if (!text) return '';
    let res = text.toUpperCase();

    // Ubah titik koma atau slash ganda menjadi koma
    res = res.replace(/;/g, ',');
    res = res.replace(/\/{2,}/g, ',');

    // Standardisasi pasangan KEY-VALUE menjadi KEY=VALUE
    // Contoh: SIZE-2 IN -> SIZE=2 IN, DIA-50 MM -> DIA=50 MM, MAT-SS316 -> MAT=SS316
    res = res.replace(/\b(SIZE|DIA|OD|ID|THK|LG|WD|HT|PRESS|TEMP|RATING|VOLT|AMP|KW|HP|RATIO|PITCH|MAT|SCH|CL|GR|MDL|DWG|POS|MFR|PN|P\/N)-([0-9A-Z/]+)\b/gi, '$1=$2');

    // Bersihkan spasi di sekitar koma dan tanda sama dengan
    res = res.replace(/\s*,\s*/g, ', ');
    res = res.replace(/\s*=\s*/g, '=');
    res = res.replace(/,\s*,/g, ',');
    res = res.replace(/\s{2,}/g, ' ');
    res = res.replace(/^[, ]+|[, ]+$/g, '');

    return res;
  }

  /**
   * Ekstraksi dan pengelompokan segmen sesuai 5 urutan standar katalog:
   * 1. Noun
   * 2. Modifier(s)
   * 3. Characteristics & Values
   * 4. Dimensions + Material + Class/Grade/Schedule
   * 5. Equipment Name + Equipment Reference Info
   */
  function parseAndCategorizeSegments(item, rawText) {
    initMaps();

    const result = {
      noun: '',
      modifiers: [],
      characteristics: [],
      dimensions_material_class: [],
      equipment_ref: [],
      raw_segments: []
    };

    // Bersihkan tanda baca awal
    const normalizedRaw = cleanPunctuationAndDelimiters(applyStandardAbbreviations(rawText));
    const parts = normalizedRaw.split(',').map(p => p.trim()).filter(Boolean);
    result.raw_segments = parts.slice();

    // 1. Ekstrak NOUN
    let nounCandidate = clean(item.major_name || item.noun || '').toUpperCase();
    if (!nounCandidate && parts.length > 0) {
      // Kata pertama dari segmen pertama
      const seg1Words = parts[0].split(/\s+/);
      nounCandidate = seg1Words[0] || '';
    }
    nounCandidate = applyStandardAbbreviations(nounCandidate);
    result.noun = nounCandidate;

    // 2. Ekstrak Modifiers dari item atau parts
    const modCandidateSet = new Set();
    [item.modifier1, item.modifier2, item.modifier3].forEach(m => {
      const c = clean(m).toUpperCase();
      if (c && !isBlankOrInvalid(c)) modCandidateSet.add(applyStandardAbbreviations(c));
    });

    // 3. Klasifikasikan sisa segmen dari parts
    parts.forEach((seg, idx) => {
      if (!seg) return;
      const upperSeg = seg.toUpperCase();

      // Jika segmen adalah Noun itu sendiri
      if (idx === 0 && (upperSeg === nounCandidate || upperSeg.startsWith(nounCandidate + ' '))) {
        const remaining = upperSeg.replace(new RegExp(`^${nounCandidate}\\s*`), '').trim();
        if (remaining) modCandidateSet.add(remaining);
        return;
      }

      // Cek apakah ini Equipment Name atau Equipment Reference
      // Pattern: FOR PUMP..., MODEL..., DWG..., POS..., P/N..., MFR...
      if (
        /^(FOR\b|EQPT\b|EQUIPMENT\b|MDL\b|MODEL\b|DWG\b|DRAWING\b|POS\b|POSITION\b|MFR\b|MANUFACTURER\b|P\/N\b|PART\s*NO)/i.test(upperSeg) ||
        /\b(DWG|POS|MDL|P\/N)=/i.test(upperSeg)
      ) {
        result.equipment_ref.push(upperSeg);
        return;
      }

      // Cek apakah ini Dimensions, Material, atau Class/Grade/Schedule
      // Dimensions: SIZE=..., DIA=..., OD=..., ID=..., THK=..., LG=..., 2 IN, 50 MM, dsb.
      // Material: MAT=..., SS316, CS, BRASS, PVC, dsb.
      // Class/Grade/Schedule: CL 150, SCH 40, GR B, dsb.
      if (
        /^(SIZE|DIA|OD|ID|THK|LG|WD|HT|DIM|DIMENSIONS?)=/i.test(upperSeg) ||
        /\b(\d+(?:\.\d+)?|\d+\/\d+)\s*(IN|MM|CM|M|FT)\b/i.test(upperSeg) ||
        /^(MAT|MATERIAL)=/i.test(upperSeg) ||
        /\b(SS316|SS304|SS|CS|CARBON STEEL|BRASS|BRONZE|COPPER|PVC|PTFE|RUBBER|EPDM|VITON|ALUMINUM|AL|CI|DI)\b/i.test(upperSeg) ||
        /^(CL|CLASS|SCH|SCHEDULE|GR|GRADE|RATING\s*CLASS)=/i.test(upperSeg) ||
        /\b(CL\s*\d+|CLASS\s*\d+|SCH\s*\d+|GR\s*[A-Z0-9]+)\b/i.test(upperSeg)
      ) {
        result.dimensions_material_class.push(upperSeg);
        return;
      }

      // Cek apakah ini Characteristics and Values (misal PRESS=..., TEMP=..., RATING=..., VOLT=...)
      if (
        /^(TYPE|RATING|PRESS|PRESSURE|TEMP|TEMPERATURE|VOLT|VOLTAGE|AMP|AMPERE|KW|HP|RPM|FLOW|PITCH|THREAD|CONN|CONNECTION|RATIO)=/i.test(upperSeg) ||
        /\b(BAR|PSI|DEG\s*C|VAC|VDC|RPM|M3\/H|GPM|NPT|FLG|RF|FF)\b/i.test(upperSeg)
      ) {
        result.characteristics.push(upperSeg);
        return;
      }

      // Jika cocok dengan salah satu modifier eksplisit
      if (modCandidateSet.has(upperSeg)) {
        return; // Akan ditambahkan dari modCandidateSet
      }

      // Default: jika masih berada di awal, masukkan ke modifier; jika di tengah/akhir masukkan ke characteristics
      if (idx <= 2 && !result.characteristics.length && !result.dimensions_material_class.length) {
        modCandidateSet.add(upperSeg);
      } else {
        result.characteristics.push(upperSeg);
      }
    });

    result.modifiers = Array.from(modCandidateSet);

    // Tambahan dari structured fields jika di deskripsi belum masuk
    if (item.size && !isBlankOrInvalid(item.size)) {
      const s = applyStandardAbbreviations(clean(item.size));
      if (!result.dimensions_material_class.some(d => d.includes(s))) {
        result.dimensions_material_class.unshift(s.startsWith('SIZE=') ? s : `SIZE=${s}`);
      }
    }
    if (item.material && !isBlankOrInvalid(item.material)) {
      const m = applyStandardAbbreviations(clean(item.material));
      if (!result.dimensions_material_class.some(d => d.includes(m))) {
        result.dimensions_material_class.push(m.startsWith('MAT=') ? m : `MAT=${m}`);
      }
    }
    if (item.class && !isBlankOrInvalid(item.class)) {
      const c = applyStandardAbbreviations(clean(item.class));
      if (!result.dimensions_material_class.some(d => d.includes(c))) {
        result.dimensions_material_class.push(c);
      }
    }

    // Equipment ref dari structured fields
    if (item.manufacture && !isBlankOrInvalid(item.manufacture)) {
      const mfr = `MFR=${applyStandardAbbreviations(clean(item.manufacture))}`;
      if (!result.equipment_ref.some(e => e.includes('MFR='))) result.equipment_ref.push(mfr);
    }
    if (item.part_no && !isBlankOrInvalid(item.part_no)) {
      const pn = `P/N=${applyStandardAbbreviations(clean(item.part_no))}`;
      if (!result.equipment_ref.some(e => e.includes('P/N='))) result.equipment_ref.push(pn);
    }
    if (item.model_no && !isBlankOrInvalid(item.model_no)) {
      const mdl = `MDL=${applyStandardAbbreviations(clean(item.model_no))}`;
      if (!result.equipment_ref.some(e => e.includes('MDL='))) result.equipment_ref.push(mdl);
    }
    if (item.dwg_no && !isBlankOrInvalid(item.dwg_no)) {
      const dwg = `DWG=${applyStandardAbbreviations(clean(item.dwg_no))}`;
      if (!result.equipment_ref.some(e => e.includes('DWG='))) result.equipment_ref.push(dwg);
    }
    if (item.pos_no && !isBlankOrInvalid(item.pos_no)) {
      const pos = `POS=${applyStandardAbbreviations(clean(item.pos_no))}`;
      if (!result.equipment_ref.some(e => e.includes('POS='))) result.equipment_ref.push(pos);
    }

    return result;
  }

  /**
   * Membangun teks saran katalog standar yang terstruktur:
   * [NOUN], [MODIFIER(S)], [CHARACTERISTICS & VALUES], [DIMENSIONS + MATERIAL + CLASS], [EQUIPMENT REF]
   */
  function buildSuggestedDescription(categorized, isService = false) {
    const segments = [];

    // Jika Jasa / Service
    if (isService) {
      segments.push('SERVICE:');
    }

    // 1. NOUN
    if (categorized.noun) {
      segments.push(categorized.noun);
    }

    // 2. MODIFIER(S)
    if (categorized.modifiers && categorized.modifiers.length > 0) {
      categorized.modifiers.forEach(m => {
        if (m && !segments.includes(m)) segments.push(m);
      });
    }

    // 3. CHARACTERISTICS AND VALUES
    if (categorized.characteristics && categorized.characteristics.length > 0) {
      categorized.characteristics.forEach(c => {
        if (c && !segments.includes(c)) segments.push(c);
      });
    }

    // 4. DIMENSIONS + MATERIAL + CLASS AND/OR GRADE AND/OR SCHEDULE
    if (categorized.dimensions_material_class && categorized.dimensions_material_class.length > 0) {
      categorized.dimensions_material_class.forEach(d => {
        if (d && !segments.includes(d)) segments.push(d);
      });
    }

    // 5. EQUIPMENT NAME + EQUIPMENT REFERENCE INFORMATION (MODEL/DWG/POS/MFR/PN)
    if (categorized.equipment_ref && categorized.equipment_ref.length > 0) {
      categorized.equipment_ref.forEach(e => {
        if (e && !segments.includes(e)) segments.push(e);
      });
    }

    let finalStr = segments.join(', ');
    if (isService && finalStr.startsWith('SERVICE:, ')) {
      finalStr = finalStr.replace('SERVICE:, ', 'SERVICE: ');
    }

    return cleanPunctuationAndDelimiters(finalStr);
  }

  /**
   * Evaluasi satu baris material secara menyeluruh (Urutan, Tanda Baca, Singkatan, Typo, dan Pembanding)
   */
  function auditMaterialRow(item) {
    initMaps();

    const issues = [];
    const suggestions = [];
    let score = 100;

    const rawText = clean(item.item_text_result || item.item_text || item.description || '');
    const templateCode = clean(item.template_code || '').toUpperCase();
    const isService = templateCode.startsWith('SVC') || rawText.toUpperCase().startsWith('SERVICE:');

    // 1. Parsing & Kategorisasi 5 Segmen Standar
    const categorized = parseAndCategorizeSegments(item, rawText);
    const suggestedText = buildSuggestedDescription(categorized, isService);

    // Checkpoints status
    const checkpoints = {
      order_ok: true,
      punctuation_ok: true,
      abbreviations_ok: true,
      completeness_ok: true
    };

    // -------------------------------------------------------------------------
    // 2. RULE: Pemeriksaan Kapitalisasi (Harus UPPERCASE)
    // -------------------------------------------------------------------------
    if (rawText && rawText !== rawText.toUpperCase()) {
      score -= 5;
      checkpoints.punctuation_ok = false;
      issues.push({
        type: 'CASING',
        severity: 'minor',
        field: 'item_text_result',
        message: 'Deskripsi mengandung huruf kecil. Standar katalog mewajibkan SEMUA HURUF KAPITAL (UPPERCASE).'
      });
      suggestions.push({
        field: 'item_text_result',
        suggested: rawText.toUpperCase(),
        reason: 'Ubah seluruh huruf menjadi kapital'
      });
    }

    // -------------------------------------------------------------------------
    // 3. RULE: Pemeriksaan Tanda Baca, Kutip Inch, & Delimiter
    // -------------------------------------------------------------------------
    // Cek tanda kutip inch (misal 2" atau 1/2")
    if (/(\d+(?:\.\d+)?|\d+\/\d+)\s*["']/.test(rawText)) {
      score -= 5;
      checkpoints.punctuation_ok = false;
      issues.push({
        type: 'PUNCTUATION_QUOTE',
        severity: 'minor',
        field: 'item_text_result',
        message: 'Penggunaan tanda kutip (" atau \') untuk satuan ukuran tidak baku. Gunakan "IN" untuk inch atau "FT" untuk feet.'
      });
    }

    // Cek koma tidak beraturan (spasi sebelum koma, koma ganda, titik koma)
    if (/;\s*|,\s*,|\s+,/.test(rawText)) {
      score -= 5;
      checkpoints.punctuation_ok = false;
      issues.push({
        type: 'PUNCTUATION_DELIMITER',
        severity: 'minor',
        field: 'item_text_result',
        message: 'Penulisan tanda baca koma/titik-koma tidak rapi. Gunakan pemisah koma dan satu spasi (, ).'
      });
    }

    // Cek delimiter KEY-VALUE yang memakai strip bukan '='
    const dashDelimiterRegex = /\b(SIZE|DIA|OD|ID|THK|LG|WD|HT|PRESS|TEMP|RATING|VOLT|AMP|KW|HP|RATIO|PITCH|MAT|SCH|CL|GR|MDL|DWG|POS|MFR|PN|P\/N)-([0-9/])/gi;
    if (dashDelimiterRegex.test(rawText)) {
      score -= 5;
      checkpoints.punctuation_ok = false;
      issues.push({
        type: 'SYNTAX_DELIMITER',
        severity: 'minor',
        field: 'item_text_result',
        message: 'Penulisan atribut spesifikasi menggunakan tanda minus (-). Standar baku menggunakan tanda sama dengan (=), misal: SIZE=2 IN, MAT=SS316.'
      });
    }

    // -------------------------------------------------------------------------
    // 4. RULE: Pemeriksaan Kepatuhan Urutan Katalog (Noun -> Modifiers -> Char -> Dim/Mat/Class -> Equip)
    // -------------------------------------------------------------------------
    if (rawText && categorized.noun) {
      const upperRaw = rawText.toUpperCase();
      const firstSegment = (upperRaw.split(',')[0] || '').trim();

      // Cek apakah Noun berada di segmen paling depan
      if (!isService && !firstSegment.includes(categorized.noun)) {
        score -= 15;
        checkpoints.order_ok = false;
        issues.push({
          type: 'ORDER_VIOLATION',
          severity: 'critical',
          field: 'item_text_result',
          message: `Urutan katalog tidak sesuai standar. NOUN ('${categorized.noun}') harus berada di awal deskripsi sebelum modifier atau dimensi.`
        });
        suggestions.push({
          field: 'item_text_result',
          suggested: suggestedText,
          reason: 'Atur ulang urutan: NOUN, MODIFIERS, CHARACTERISTICS, DIMENSIONS/MAT/CLASS, EQUIPMENT REF'
        });
      }
    }

    // -------------------------------------------------------------------------
    // 5. RULE: Pemeriksaan Kamus Singkatan (Abbreviation Compliance)
    // -------------------------------------------------------------------------
    if (rawText) {
      const words = rawText.toUpperCase().split(/[\s,]+/);
      for (const w of words) {
        if (fullToAbvMap.has(w)) {
          const recAbv = fullToAbvMap.get(w);
          if (w.length > 3 && recAbv !== w) {
            score -= 3;
            checkpoints.abbreviations_ok = false;
            issues.push({
              type: 'ABBREVIATION_VIOLATION',
              severity: 'info',
              field: 'item_text_result',
              message: `Kata '${w}' dapat disingkat menjadi '${recAbv}' sesuai kamus standar SCS.`
            });
          }
        }
      }
    }

    // -------------------------------------------------------------------------
    // 6. RULE: Deteksi Typo Spesifik
    // -------------------------------------------------------------------------
    const commonTypos = [
      { wrong: 'COPLING', right: 'COUPLING', field: 'major_name' },
      { wrong: 'CLIB', right: 'CLIP', field: 'modifier1' },
      { wrong: 'GREATHER', right: 'GREATER', field: 'item_text_result' },
      { wrong: 'REINFORCEED', right: 'REINFORCED', field: 'item_text_result' },
      { wrong: 'ENVIRONTMENTAL', right: 'ENVIRONMENTAL', field: 'item_text_result' },
      { wrong: 'GALVANIZE', right: 'GALV', field: 'material' },
      { wrong: 'BEERNG', right: 'BEARING', field: 'major_name' },
      { wrong: 'VLVE', right: 'VALVE', field: 'major_name' }
    ];

    commonTypos.forEach(t => {
      const regex = new RegExp(`\\b${t.wrong}\\b`, 'i');
      if (regex.test(rawText)) {
        score -= 8;
        checkpoints.abbreviations_ok = false;
        issues.push({
          type: 'SPELLING_TYPO',
          severity: 'warning',
          field: t.field,
          message: `Ditemukan ejaan/typo: '${t.wrong}'. Seharusnya '${t.right}'.`
        });
        suggestions.push({
          field: t.field,
          suggested: t.right,
          reason: `Koreksi typo '${t.wrong}' -> '${t.right}'`
        });
      }
    });

    // -------------------------------------------------------------------------
    // 7. RULE: Template Mandatory Fields Check
    // -------------------------------------------------------------------------
    const tempPrefix = templateCode.split('-')[0];
    const templateDef = (window.CATALOG_RULES?.TEMPLATES || []).find(t => t.code === tempPrefix);

    if (!templateCode) {
      score -= 20;
      checkpoints.completeness_ok = false;
      issues.push({
        type: 'TEMPLATE_MISSING',
        severity: 'critical',
        field: 'template_code',
        message: 'Kode template belum ditentukan (misal: GEN-XX, UNT-XX, OEM-XX, STR-XX).'
      });
    } else if (templateDef) {
      const mfr = clean(item.manufacture || item.manufacturer || '').toUpperCase();
      const dwgNo = clean(item.dwg_no || item.drawing_no || '').toUpperCase();
      const partNo = clean(item.part_no || item.part_number || '').toUpperCase();
      const modelNo = clean(item.model_no || '').toUpperCase();
      const size = clean(item.size || item.dimensions || '').toUpperCase();
      const matl = clean(item.material || '').toUpperCase();

      if (templateDef.code === 'OEM') {
        if (isBlankOrInvalid(mfr)) {
          score -= 15;
          checkpoints.completeness_ok = false;
          issues.push({
            type: 'MANDATORY_MISSING',
            severity: 'critical',
            field: 'manufacture',
            message: 'Template OEM wajib memiliki Manufacture/Brand spesifik.'
          });
        }
        if (isBlankOrInvalid(partNo)) {
          score -= 20;
          checkpoints.completeness_ok = false;
          issues.push({
            type: 'MANDATORY_MISSING',
            severity: 'critical',
            field: 'part_no',
            message: 'Template OEM wajib memiliki Part Number yang valid dari pabrikan.'
          });
        }
        if (isBlankOrInvalid(dwgNo) && isBlankOrInvalid(modelNo)) {
          score -= 10;
          checkpoints.completeness_ok = false;
          issues.push({
            type: 'MANDATORY_MISSING',
            severity: 'warning',
            field: 'dwg_no',
            message: 'Template OEM membutuhkan referensi alat (Drawing No atau Model No).'
          });
        }
      } else if (templateDef.code === 'UNT') {
        if (isBlankOrInvalid(mfr)) {
          score -= 15;
          checkpoints.completeness_ok = false;
          issues.push({
            type: 'MANDATORY_MISSING',
            severity: 'critical',
            field: 'manufacture',
            message: 'Template UNIT wajib memiliki Manufacture/Brand.'
          });
        }
        if (isBlankOrInvalid(partNo) && isBlankOrInvalid(modelNo)) {
          score -= 15;
          checkpoints.completeness_ok = false;
          issues.push({
            type: 'MANDATORY_MISSING',
            severity: 'critical',
            field: 'part_no',
            message: 'Template UNIT wajib mencantumkan Model Number atau Part Number.'
          });
        }
      } else if (templateDef.code === 'STR') {
        if (isBlankOrInvalid(size)) {
          score -= 15;
          checkpoints.completeness_ok = false;
          issues.push({
            type: 'MANDATORY_MISSING',
            severity: 'critical',
            field: 'size',
            message: 'Template Construction (STR) wajib memiliki dimensi/ukuran fisik (Size).'
          });
        }
        if (isBlankOrInvalid(matl)) {
          score -= 15;
          checkpoints.completeness_ok = false;
          issues.push({
            type: 'MANDATORY_MISSING',
            severity: 'critical',
            field: 'material',
            message: 'Template Construction (STR) wajib mencantumkan jenis material (misal SS316, SS400).'
          });
        }
      }
    }

    // Batasi skor minimum 0 dan maksimum 100
    score = Math.max(0, Math.min(100, Math.round(score)));

    let status = 'COMPLIANT';
    if (score < 60) status = 'NON_COMPLIANT';
    else if (score < 90) status = 'WARNING';

    return {
      material_id: item.material_code || item.id || '-',
      material_code: item.material_code || item.id || '-',
      item_text: rawText,
      suggested_text: suggestedText || rawText,

      template_code: templateCode,
      score,
      status,

      reviewed_by: item.reviewed_by || null,
      reviewed_at: item.reviewed_at || null,
      review_notes: item.review_notes || '',
      issue_count: issues.length,
      issues,
      suggestions,
      segments: categorized,
      checkpoints
    };
  }

  /**
   * Evaluasi Batch Dataset Material Master
   */
  function auditCatalogDataset(rows) {
    if (!Array.isArray(rows)) return { summary: {}, results: [] };

    const results = rows.map(r => auditMaterialRow(r));

    let totalScore = 0;
    let compliantCount = 0;
    let warningCount = 0;
    let nonCompliantCount = 0;
    let typoCount = 0;
    let mandatoryMissingCount = 0;
    let pendingReviewCount = 0;
    let approvedCount = 0;
    let revisedCount = 0;
    let rejectedCount = 0;

    results.forEach(res => {
      totalScore += res.score;
      if (res.status === 'COMPLIANT') compliantCount++;
      else if (res.status === 'WARNING') warningCount++;
      else nonCompliantCount++;

      if (res.review_status === 'APPROVED_SUGGESTION') approvedCount++;
      else if (res.review_status === 'REVISED_MANUAL') revisedCount++;
      else if (res.review_status === 'REJECTED_ORIGINAL') rejectedCount++;
      else pendingReviewCount++;

      res.issues.forEach(iss => {
        if (iss.type === 'SPELLING_TYPO') typoCount++;
        if (iss.type === 'MANDATORY_MISSING' || iss.type === 'TEMPLATE_MISSING') mandatoryMissingCount++;
      });
    });

    const total = results.length;
    const avgScore = total > 0 ? Math.round(totalScore / total) : 100;

    return {
      summary: {
        total_items: total,
        avg_score: avgScore,
        compliant_count: compliantCount,
        warning_count: warningCount,
        non_compliant_count: nonCompliantCount,
        typo_count: typoCount,
        mandatory_missing_count: mandatoryMissingCount,
        pending_review_count: pendingReviewCount,
        approved_count: approvedCount,
        revised_count: revisedCount,
        rejected_count: rejectedCount,
        reviewed_count: (approvedCount + revisedCount + rejectedCount),
        compliance_rate: total > 0 ? Math.round((compliantCount / total) * 100) : 100
      },
      results
    };
  }

  };

  async function handleAdminLogin(e) {
    if (e && e.preventDefault) e.preventDefault();

    const u = $('loginUsername').value.trim();
    const p = $('loginPassword').value;

    if (!u || !p) {
      toast('Username dan password wajib diisi.', 'error');
      return;
    }

    try {
      showLoading(true, 'Memverifikasi akun pengguna...');
      const r = await callServer('loginUser', u, p);
      const user = r.data || {};
      if (!user.full_name && user.fullName) {
        user.full_name = user.fullName;
      }
      user.role = String(user.role || 'OPERATOR').toUpperCase();
      if (!user.token) {
        user.token = 'session_' + (user.id || user.username || 'user') + '_' + Date.now();
      }
      state.configured = true;
      state.currentUser = user;
      state.accessControl = user.permissions || {};
      sessionStorage.setItem('admin_session', JSON.stringify(user));

      const modalEl = $('adminLoginModal');
      if (modalEl && typeof bootstrap !== 'undefined') {
        bootstrap.Modal.getInstance(modalEl)?.hide();
      }

      updateConnectionUI(true, 'Terhubung via Google Apps Script Web App', state.supabaseUrl);
      applyAccessControl();
      await loadAccessControl();
      applyAccessControl();
      toast(`Selamat datang kembali, ${user.full_name || user.fullName || user.username}! Anda masuk sebagai ${user.role}.`, 'success');
      if (isMenuAllowed('dashboard')) navigateTo('dashboard');
    } catch (err) {
      toast('Login gagal: ' + err.message, 'error');
    } finally {
      showLoading(false);
    }
  }

  /**

   */
  async function handleFile(e) {
    const f = e.target.files[0];
    state.selectedFile = f;
    state.parsedRows = [];
    if (!f) return;

    if (f.size > 50 * 1024 * 1024) {
      toast('Ukuran file melebihi 50 MB', 'error');
      e.target.value = '';
      return;
    }

    $('fileInfo').classList.remove('d-none');
    $('fileInfo').textContent = `${f.name} • ${(f.size / 1024 / 1024).toFixed(2)} MB`;

    try {
      showLoading(true, 'Membaca spreadsheet & menjalankan Pra-Audit Konsistensi...');
      const rawRows = await parseSpreadsheet(f);

      if (rawRows.length > 100000) throw new Error('Record melebihi batas 100.000 baris.');

      // Validasi & Auto-generate material_code jika belum ada
      state.parsedRows = rawRows.map((r, i) => {
        const item = { ...r };
        if (!item.material_code && !item.material_number) {
          // Buat identifier sementara berbasis Part No / Noun / Index
          const cleanPn = String(item.part_number || '').trim().replace(/[^a-zA-Z0-9]/g, '');
          item.material_code = cleanPn ? `PN-${cleanPn}` : `MAT-${100000 + i + 1}`;
        }
        return item;
      });

      // Jalankan Gatekeeper Consistency Pre-Audit
      runPreUploadGatekeeperAudit(state.parsedRows);

      showLoading(false);
      $('uploadBtn').disabled = false;
      if ($('cancelUploadBtn')) $('cancelUploadBtn').classList.remove('d-none');
      toast(`${fmt(state.parsedRows.length)} record berhasil dipindai & dinilai konsistensinya.`);
    } catch (err) {
      showLoading(false);
      $('uploadBtn').disabled = true;
      if ($('cancelUploadBtn')) $('cancelUploadBtn').classList.add('d-none');
      toast(err.message, 'error');
    }
  }

  function runPreUploadGatekeeperAudit(rows = []) {
    const box = $('preUploadAuditBox');
    if (!box || !window.ConsistencyEngine) return;

    box.classList.remove('d-none');

    // Normalisasi format untuk validator
    const normalizedRows = rows.map((row, idx) => {
      const desc = (row.material_description || row.item_text_result || '').trim();
      const firstSegment = desc.split(',')[0] || '';
      return {
        id: row.material_code || `Row-${idx + 1}`,
        material_code: row.material_code || `Row-${idx + 1}`,
        item_text_result: desc,
        template_code: row.template_code || '',
        major_name: row.noun || row.major_name || firstSegment,
        modifier1: row.modifier1 || '',
        modifier2: row.modifier2 || '',
        modifier3: row.modifier3 || '',
        manufacture: row.manufacturer || row.manufacture || '',
        part_no: row.part_number || row.part_no || '',
        model_no: row.model_no || '',
        dwg_no: row.dwg_no || '',
        pos_no: row.pos_no || '',
        size: row.size || '',
        material: row.material || '',
        class: row.class || ''
      };
    });

    const audit = window.ConsistencyEngine.auditCatalogDataset(normalizedRows);
    const summary = audit.summary;

    if ($('preUploadScore')) $('preUploadScore').textContent = `${summary.avg_score}%`;
    if ($('preUploadCompliant')) $('preUploadCompliant').textContent = fmt(summary.compliant_count);
    if ($('preUploadWarning')) $('preUploadWarning').textContent = fmt(summary.warning_count);
    if ($('preUploadCritical')) $('preUploadCritical').textContent = fmt(summary.non_compliant_count);

    const badge = $('preUploadGatekeeperBadge');
    const warningAlert = $('preUploadWarningAlert');
    const warningText = $('preUploadWarningText');

    if (summary.avg_score >= 85 && summary.non_compliant_count === 0) {
      if (badge) {
        badge.className = 'badge bg-success';
        badge.innerHTML = '<i class="bi bi-shield-check me-1"></i>LOLOS STANDAR (EXCELLENT)';
      }
      if (warningAlert) warningAlert.classList.add('d-none');
    } else if (summary.non_compliant_count > 0) {
      if (badge) {
        badge.className = 'badge bg-danger';
        badge.innerHTML = `<i class="bi bi-shield-slash me-1"></i>PERHATIAN: ${fmt(summary.non_compliant_count)} DATA KRITIS`;
      }
      if (warningAlert) {
        warningAlert.classList.remove('d-none');
        if (warningText) {
          warningText.innerHTML = `Terdeteksi <strong>${fmt(summary.non_compliant_count)} baris</strong> data tidak memenuhi syarat wajib template (misal: part number/manufacturer kosong pada template OEM, atau typo fatal).`;
        }
      }
    } else {
      if (badge) {
        badge.className = 'badge bg-warning text-dark';
        badge.innerHTML = '<i class="bi bi-shield-exclamation me-1"></i>PERINGATAN (WARNING)';
      }
      if (warningAlert) {
        warningAlert.classList.remove('d-none');
        if (warningText) {
          warningText.innerHTML = 'Data secara umum memenuhi format, namun memiliki beberapa singkatan yang tidak baku atau format pemisah atribut kurang konsisten.';
        }
      }
    }

    // Render Preview Sampel (Maksimal 10 Baris Pertama)
    const previewBody = $('preUploadPreviewBody');
    if (previewBody) {
      const sample = audit.results.slice(0, 10);
      previewBody.innerHTML = sample.map((item, idx) => {
        const statusBadge = item.status === 'COMPLIANT' ? 'bg-success' :
                            item.status === 'WARNING' ? 'bg-warning text-dark' : 'bg-danger';
        const note = item.issues.length ? item.issues[0].message : 'Format konsisten';
        return `
          <tr>
            <td>${idx + 1}</td>
            <td><strong>${escapeHtml(item.material_id)}</strong></td>
            <td>
              <div class="text-truncate" style="max-width: 250px;">${escapeHtml(item.item_text)}</div>
              <small class="badge bg-secondary" style="font-size: 9px;">${escapeHtml(item.template_code)}</small>
            </td>
            <td><strong>${item.score}%</strong></td>
            <td><span class="badge ${statusBadge}">${item.status}</span></td>
            <td><small class="text-muted text-truncate d-block" style="max-width: 200px;" title="${escapeHtml(note)}">${escapeHtml(note)}</small></td>
          </tr>
        `;
      }).join('');
    }
  }

  function parseSpreadsheet(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('File tidak dapat dibaca.'));
      reader.onload = e => {
        try {
          const wb = XLSX.read(e.target.result, { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const raw = XLSX.utils.sheet_to_json(ws, { defval: '' });
          resolve(raw.map(mapHeaders));
        } catch (err) {
          reject(new Error('Format spreadsheet tidak valid: ' + err.message));
        }
      };
      reader.readAsArrayBuffer(file);
    });
  }

  function mapHeaders(r) {
    const out = {};
    Object.entries(r).forEach(([k, v]) => {
      const key = k.toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
      const aliases = {
        material: 'material_code',
        material_number: 'material_code',
        kode_material: 'material_code',
        description: 'material_description',
        item_text_result: 'material_description',
        item_text: 'material_description',
        material_desc: 'material_description',
        deskripsi: 'material_description',
        brand: 'manufacturer',
        manufacture: 'manufacturer',
        mfr: 'manufacturer',
        pabrikan: 'manufacturer',
        part_no: 'part_number',
        nomor_part: 'part_number',
        major_name: 'noun',
        major_name_noun: 'noun',
        noun: 'noun',
        modifier_1: 'modifier1',
        modifier_2: 'modifier2',
        modifier_3: 'modifier3',
        template: 'template_code',
        template_code: 'template_code',
        material_group_desc: 'material_group',
        grup: 'material_group',
        uom: 'base_uom',
        satuan: 'base_uom',
        base_unit: 'base_uom',
        quantity: 'stock_qty',
        stock: 'stock_qty',
        jumlah: 'stock_qty',
        value: 'stock_value',
        inventory_value: 'stock_value',
        nilai_stok: 'stock_value'
      };
      out[aliases[key] || key] = v;
    });
    return out;
  }

  async function uploadFile() {
    if (!requireAction('uploadMaterials')) return;
    if (!state.selectedFile || !state.parsedRows.length) return;
    try {
      showLoading(true, 'Mengupload ke Supabase...');
      const r = await callServer('uploadMaterials', state.parsedRows, state.selectedFile.name);
      const resData = r.data || {};
      const inserted = resData.inserted ?? resData.newInserted ?? 0;
      const skipped = resData.skipped ?? resData.duplicateSkipped ?? 0;
      const errors = resData.errors ?? 0;

      let msg = `Hasil Upload: ${fmt(inserted)} data baru ditambahkan.`;
      if (skipped > 0) {
        msg += ` (${fmt(skipped)} data duplikat dilewati).`;
      }
      if (errors > 0) {
        msg += ` [${fmt(errors)} baris error].`;
      }

      toast(msg, errors ? 'warning' : 'success');
      $('materialFile').value = '';
      $('uploadBtn').disabled = true;
      if ($('cancelUploadBtn')) $('cancelUploadBtn').classList.add('d-none');
      if ($('preUploadAuditBox')) $('preUploadAuditBox').classList.add('d-none');
      state.parsedRows = [];
      loadUploadHistory();
      loadDashboard();
      if ($('section-materials').classList.contains('active')) {

      toast('Upload gagal: ' + e.message, 'error');

  function renderDuplicatesTable() {
    const minScore = Number($('dupScoreFilter')?.value || 75);
    const statusFilter = $('dupStatusFilter')?.value || 'ALL';
    const searchQuery = ($('dupSearchInput')?.value || '').toLowerCase().trim();

    const filtered = state.duplicates.filter(item => {
      const scoreOk = (Number(item.duplicate_score) || 0) >= minScore;
      const statusOk = (statusFilter === 'ALL') || (item.review_status === statusFilter);
      const searchOk = !searchQuery ||
        (item.candidate_id || '').toLowerCase().includes(searchQuery) ||
        (item.cluster_id || '').toLowerCase().includes(searchQuery) ||
        (item.code_a || '').toLowerCase().includes(searchQuery) ||
        (item.code_b || '').toLowerCase().includes(searchQuery) ||
        (item.desc_a || '').toLowerCase().includes(searchQuery) ||
        (item.desc_b || '').toLowerCase().includes(searchQuery);
      return scoreOk && statusOk && searchOk;
    });

    // Update Mini Stat Bar
    const uniqueClusters = new Set(filtered.map(x => x.cluster_id || x.candidate_id)).size;
    const totalSavings = filtered.reduce((acc, curr) => acc + Number(curr.potential_saving || 0), 0);

    if ($('dupStatPairs')) $('dupStatPairs').textContent = fmt(filtered.length);
    if ($('dupStatClusters')) $('dupStatClusters').textContent = fmt(uniqueClusters);
    if ($('dupStatSavings')) $('dupStatSavings').textContent = money(totalSavings);

    const tbody = $('duplicatesBody');
    if (!tbody) return;

    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted p-4">Tidak ada data kandidat duplikasi yang sesuai filter. Klik "Jalankan Analisis AI" untuk memulai deteksi.</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(x => {
      const scoreVal = Number(x.duplicate_score) || 0;
      const scoreBadgeClass = scoreVal >= 95 ? 'score-high' : scoreVal >= 85 ? 'score-mid' : 'score-low';
      const statusBadgeClass = x.review_status === 'MERGE_AND_OBSOLETE' ? 'bg-success' :
                               x.review_status === 'REJECTED_DIFFERENT' ? 'bg-danger' :
                               x.review_status === 'APPROVED_DUPLICATE' ? 'bg-warning text-dark' : 'bg-secondary';

      return `
        <tr>
          <td><span class="badge bg-primary">${escapeHtml(x.cluster_id || '-')}</span></td>
          <td><small class="text-muted fw-bold">${escapeHtml(x.candidate_id)}</small></td>
          <td>
            <div class="d-flex align-items-center gap-1">
              <span class="badge ${x.is_master_a ? 'bg-success' : 'bg-secondary'}" style="font-size:10px;">${x.is_master_a ? 'Master' : 'A'}</span>
              <strong>${escapeHtml(x.code_a || x.material_id_a)}</strong>
            </div>
            <small class="text-muted text-truncate d-inline-block" style="max-width:200px;">${escapeHtml(x.desc_a || '-')}</small>
          </td>
          <td>
            <div class="d-flex align-items-center gap-1">
              <span class="badge ${x.is_master_b ? 'bg-success' : 'bg-secondary'}" style="font-size:10px;">${x.is_master_b ? 'Master' : 'B'}</span>
              <strong>${escapeHtml(x.code_b || x.material_id_b)}</strong>
            </div>
            <small class="text-muted text-truncate d-inline-block" style="max-width:200px;">${escapeHtml(x.desc_b || '-')}</small>
          </td>
          <td><span class="badge-score ${scoreBadgeClass}">${scoreVal.toFixed(1)}%</span></td>
          <td><small class="fw-semibold text-wrap">${escapeHtml(x.rationalization_action || x.recommendation || '-')}</small></td>

          <td>
            <button type="button" class="btn btn-sm btn-outline-accent review-dup-btn" data-cid="${escapeHtml(x.candidate_id)}">
              <i class="bi bi-eye me-1"></i>Review
            </button>
          </td>
        </tr>
      `;
    }).join('');

    tbody.querySelectorAll('.review-dup-btn').forEach(b => {
      b.addEventListener('click', () => openDuplicateModal(b.dataset.cid));
    });
